{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:520px;">
  <h1>{{ _("add") }} — {{ _("transfers") }}</h1>
  <form method="post" id="transfer-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
    <div class="form-row">
      <div class="form-group">
        <label>{{ _("from_account") }}</label>
        <select name="from_account_id" id="from_account_id" required>
          {% for acc in accounts %}
          <option value="{{ acc.id }}" data-currency="{{ acc.currency }}">{{ acc.name }} ({{ acc.currency }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>{{ _("to_account") }}</label>
        <select name="to_account_id" id="to_account_id" required>
          {% for acc in accounts %}
          <option value="{{ acc.id }}" data-currency="{{ acc.currency }}">{{ acc.name }} ({{ acc.currency }})</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>{{ _("amount_sent") }} (<span id="from-currency-label">—</span>)</label>
        <input type="text" inputmode="decimal" name="amount_sent" id="amount_sent" required>
      </div>
      <div class="form-group">
        <label>{{ _("amount_received") }} (<span id="to-currency-label">—</span>)</label>
        <input type="text" inputmode="decimal" name="amount_received" id="amount_received" required>
      </div>
    </div>
    <p class="muted">{{ _("transfer_amount_hint") }}</p>
    <div class="form-group">
      <label>{{ _("date") }}</label>
      <input type="date" name="date" required>
    </div>
    <div class="form-group">
      <label>{{ _("description") }}</label>
      <input type="text" name="description" placeholder="{{ _('transfer') }}">
    </div>
    <button class="btn" type="submit">{{ _("save") }}</button>
    <a class="btn btn-secondary" href="{{ next_url or url_for('transfers.list_transfers') }}">{{ _("cancel") }}</a>
  </form>
</div>

<script>
function updateLabels() {
  var fromSel = document.getElementById('from_account_id');
  var toSel = document.getElementById('to_account_id');
  var fromCur = fromSel.options[fromSel.selectedIndex].getAttribute('data-currency');
  var toCur = toSel.options[toSel.selectedIndex].getAttribute('data-currency');
  document.getElementById('from-currency-label').textContent = fromCur;
  document.getElementById('to-currency-label').textContent = toCur;
  var amountReceived = document.getElementById('amount_received');
  if (fromCur === toCur) {
    amountReceived.value = document.getElementById('amount_sent').value;
    amountReceived.readOnly = true;
  } else {
    amountReceived.readOnly = false;
  }
}
document.getElementById('from_account_id').addEventListener('change', updateLabels);
document.getElementById('to_account_id').addEventListener('change', updateLabels);
document.getElementById('amount_sent').addEventListener('input', function() {
  var fromSel = document.getElementById('from_account_id');
  var toSel = document.getElementById('to_account_id');
  var fromCur = fromSel.options[fromSel.selectedIndex].getAttribute('data-currency');
  var toCur = toSel.options[toSel.selectedIndex].getAttribute('data-currency');
  if (fromCur === toCur) {
    document.getElementById('amount_received').value = this.value;
  }
});
updateLabels();
</script>
{% endblock %}
