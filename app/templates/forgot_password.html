{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:400px;margin:3rem auto;">
  <h1>{{ _("forgot_password") }}</h1>
  <p class="muted">{{ _("forgot_password_hint") }}</p>
  <form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>{{ _("email") }}</label>
      <input type="email" name="email" required autofocus>
    </div>
    <button class="btn" type="submit">{{ _("send_reset_link") }}</button>
  </form>
  <p style="margin-top:1rem;"><a href="{{ url_for('auth.login') }}">{{ _("login") }}</a></p>
</div>
{% endblock %}
