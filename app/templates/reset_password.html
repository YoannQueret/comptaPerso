{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:400px;margin:3rem auto;">
  <h1>{{ _("reset_password") }}</h1>
  <form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>{{ _("new_password") }}</label>
      <input type="password" name="new_password" required minlength="6" autofocus>
    </div>
    <div class="form-group">
      <label>{{ _("confirm_password") }}</label>
      <input type="password" name="confirm_password" required minlength="6">
    </div>
    <button class="btn" type="submit">{{ _("save") }}</button>
  </form>
</div>
{% endblock %}
