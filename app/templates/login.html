{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:400px;margin:3rem auto;">
  <h1>{{ _("login") }}</h1>
  <form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>{{ _("email") }}</label>
      <input type="email" name="email" required autofocus>
    </div>
    <div class="form-group">
      <label>{{ _("password") }}</label>
      <input type="password" name="password" required>
    </div>
    <button class="btn" type="submit">{{ _("login") }}</button>
  </form>
  <p style="margin-top:1rem;"><a href="{{ url_for('auth.forgot_password') }}">{{ _("forgot_password") }}</a></p>
  {% if allow_registration %}
  <p><a href="{{ url_for('auth.register') }}">{{ _("register") }}</a></p>
  {% endif %}
</div>
{% endblock %}
