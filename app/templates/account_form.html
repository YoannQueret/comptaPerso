{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:500px;">
  <h1>{{ _("edit") if account else _("add") }} — {{ _("accounts") }}</h1>
  <form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>{{ _("name") }}</label>
      <input type="text" name="name" value="{{ account.name if account else '' }}" required autofocus>
    </div>
    <div class="form-group">
      <label>{{ _("account_number") }}</label>
      <input type="text" name="account_number" value="{{ account.account_number if account else '' }}">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>{{ _("account_type") }} (<a href="{{ url_for('account_types.list_account_types') }}">{{ _("edit") }}</a>)</label>
        <select name="account_type_id">
          <option value="">—</option>
          {% for t in account_types %}
          <option value="{{ t.id }}" {{ 'selected' if account and account.account_type_id==t.id else '' }}>{{ t.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>{{ _("currency") }}</label>
        <select name="currency">
          {% for c in currencies %}
          <option value="{{ c }}" {{ 'selected' if account and account.currency==c else '' }}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>{{ _("initial_balance") }}</label>
      <input type="text" inputmode="decimal" name="initial_balance" value="{{ account.initial_balance if account else '0' }}">
    </div>
    {% if account %}
    <div class="form-group">
      <label><input type="checkbox" name="active" {{ 'checked' if account.active else '' }} style="width:auto;display:inline-block;"> {{ _("active") }}</label>
    </div>
    {% endif %}
    <button class="btn" type="submit">{{ _("save") }}</button>
    <a class="btn btn-secondary" href="{{ url_for('accounts.list_accounts') }}">{{ _("cancel") }}</a>
  </form>
</div>
{% endblock %}
