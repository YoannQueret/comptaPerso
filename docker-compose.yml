services:
  comptaperso:
    build: .
    container_name: comptaperso
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    environment:
      - SECRET_KEY=change-me-in-production
      - DB_ENGINE=sqlite
      - DATA_DIR=/app/data
      - ALLOW_REGISTRATION=true
      - PORT=${PORT:-5000}
      # Flask debugger/auto-reload — leave disabled in production.
      # - FLASK_DEBUG=false
      # Outgoing email (password reset) — uncomment and fill in to enable sending.
      # Leave SMTP_HOST unset to disable sending (reset requests still succeed,
      # the email is just logged instead of delivered).
      # - SMTP_HOST=smtp.example.com
      # - SMTP_PORT=587
      # - SMTP_USERNAME=you@example.com
      # - SMTP_PASSWORD=your-smtp-password
      # - SMTP_USE_TLS=true
      # - SMTP_USE_SSL=false
      # - MAIL_FROM=no-reply@example.com
    volumes:
      - comptaperso_data:/app/data

volumes:
  comptaperso_data:
